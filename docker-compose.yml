version: '3.8'

services:
  replace-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: replace-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
